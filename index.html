<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jibb Games</title>
<meta name="description" content="Jibb Games – small games and apps from Sweden.">
<style>
  :root { --bg: #fffaf0; --ink: #2a2233; --muted: #6f6578; --accent: #e8508a; --card: #ffffff; --rule: #eadfcf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #19161f; --ink: #f1ecf7; --muted: #a69db0; --accent: #ff8ab8; --card: #231f2b; --rule: #34303d; } }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 32px 16px 48px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { color: var(--accent); font-size: 32px; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0 0 32px; display: grid; gap: 10px; }
  li { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  strong { font-weight: 700; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Jibb Games</h1>
  <p>Small games and apps from Sweden.</p>
  <ul>
    <li><strong>Bold Guess</strong> <a href="https://ballpark-nu.vercel.app/privacy">Privacy</a></li>
    <li><strong>Wobble Van</strong> <a href="wobble-van/privacy.html">Privacy</a></li>
    <li><strong>Hornfall</strong> <a href="hornfall/privacy.html">Privacy</a></li>
    <li><strong>Sparstegen</strong> <a href="sparstegen/privacy.html">Integritet</a></li>
  </ul>
  <p>Contact: <a href="mailto:jibbgamestudio@gmail.com">jibbgamestudio@gmail.com</a></p>
</main>
</body>
</html>
